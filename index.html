<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion ERP | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="./assets/img/telefone.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0A1628;          /* Azul Profundo */
            --accent: #EAB308;           /* Dourado / Âmbar */
            --accent-hover: #CA8A04;
            --accent-gradient: linear-gradient(135deg, #0A1628 0%, #1E293B 100%);
            --accent-gradient-hover: linear-gradient(135deg, #1E293B 0%, #334155 100%);
            --light-bg: #F8FAFC;
            --dark-text: #0F172A;
            --muted-text: #64748B;
            --neutral-gray: #94A3B8;
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A1628;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            color: #0F172A;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glow & Mesh Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(234, 179, 8, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(30, 41, 59, 0.6) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(10, 22, 40, 0.9) 0%, transparent 80%);
            z-index: 0;
        }

        /* Subtle grid pattern */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid #E2E8F0;
        }

        /* Accent bar on top of card */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #EAB308;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            width: 60px;
            height: 60px;
            background: #0A1628;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(10, 22, 40, 0.25);
            border: 1px solid rgba(234, 179, 8, 0.3);
            transition: transform 0.25s ease;
        }

        .login-logo:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .login-header .subtitle {
            color: #64748B;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group label .required {
            color: #EF4444;
            margin-left: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 9px;
            font-size: 13.5px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #FFFFFF;
            color: #0F172A;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .form-group input::placeholder {
            color: #94A3B8;
            font-weight: 400;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0A1628;
            box-shadow: 0 0 0 3px rgba(10, 22, 40, 0.1);
        }

        .form-group input:hover {
            border-color: #94A3B8;
        }

        .btn-login {
            width: 100%;
            padding: 12px 18px;
            background: #0A1628;
            color: #FFFFFF;
            border: none;
            border-radius: 9px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 14px rgba(10, 22, 40, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #1E293B;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(10, 22, 40, 0.35);
            filter: brightness(1.03);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-first-access {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            color: #475569;
            padding: 10px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-first-access:hover {
            background: #F1F5F9;
            border-color: #CBD5E1;
            color: #0A1628;
            transform: translateY(-1px);
        }

        .login-divider {
            margin-top: 22px;
            text-align: center;
            border-top: 1px solid #F1F5F9;
            padding-top: 16px;
            font-size: 12.5px;
        }

        .login-divider a {
            color: #0A1628;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .login-divider a:hover {
            color: #EAB308;
            text-decoration: underline;
        }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #94A3B8;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-container {
                padding: 16px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>Aion ERP</h1>
                <p class="subtitle">by AionLabs</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuário ou Email <span class="required">*</span></label>
                    <input type="text" id="email" placeholder="seu.usuario ou seu@email.com" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Senha <span class="required">*</span></label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    <span>Entrar no Sistema</span>
                </button>
            </form>

            <div style="margin-top: 14px; text-align: center;">
                <button type="button" onclick="window.abrirPrimeiroAcesso()" class="btn-first-access">
                    ✨ Primeiro Acesso? Identificar Loja por CNPJ
                </button>
            </div>

            <div class="login-divider">
                <span style="color: #64748B;">Precisa de suporte?</span>
                <a href="manual_do_sistema.html" target="_blank">
                    📖 Manual do Usuário
                </a>
            </div>
        </div>

        <div class="login-footer">
            <p>Aion ERP © 2026 • by AionLabs</p>
        </div>
    </div>

    <!-- Scripts do Sistema -->
    <script src="js/security.js?v=1.0.4"></script>
    <script src="js/config.js?v=1.0.4"></script>
    <script src="js/primeiro-acesso.js?v=1.0.4"></script>
    <script src="js/auth.js?v=1.0.4"></script>
</body>
</html>
